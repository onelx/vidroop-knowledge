name: Crawl Vidroop

on:
  # Cron diario a las 03:00 ART (06:00 UTC)
  schedule:
    - cron: "0 6 * * *"
  # Disparado desde la API REST vía repository_dispatch
  repository_dispatch:
    types: [crawl_academia]
  # Manual desde la UI de GitHub Actions
  workflow_dispatch:
    inputs:
      academia_id:
        description: "UUID de la academia"
        required: true
      crawl_id:
        description: "UUID del crawl existente (si lo dejás vacío, se crea uno nuevo)"
        required: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: crawler/package-lock.json

      - name: Install deps
        working-directory: crawler
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: crawler
        run: npx playwright install --with-deps chromium

      - name: Compile crawler TS → JS
        working-directory: crawler
        run: npm run build

      # Determinar academia_id y crawl_id según el tipo de evento
      - name: Resolver inputs
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ACADEMIA: ${{ github.event.client_payload.academia_id }}
          DISPATCH_CRAWL: ${{ github.event.client_payload.crawl_id }}
          MANUAL_ACADEMIA: ${{ github.event.inputs.academia_id }}
          MANUAL_CRAWL: ${{ github.event.inputs.crawl_id }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            echo "academia_id=$DISPATCH_ACADEMIA" >> $GITHUB_OUTPUT
            echo "crawl_id=$DISPATCH_CRAWL" >> $GITHUB_OUTPUT
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "academia_id=$MANUAL_ACADEMIA" >> $GITHUB_OUTPUT
            echo "crawl_id=$MANUAL_CRAWL" >> $GITHUB_OUTPUT
          else
            # cron: no hay inputs, se procesará en un paso aparte
            echo "academia_id=" >> $GITHUB_OUTPUT
            echo "crawl_id=" >> $GITHUB_OUTPUT
          fi

      # Si es cron, iterar todas las academias activas
      - name: Crawl batch (cron)
        if: github.event_name == 'schedule'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
        working-directory: crawler
        run: |
          # Lista todas las academias activas y corre el crawler para cada una
          node --input-type=module -e "
            import { createClient } from '@supabase/supabase-js';
            const supa = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, { auth:{ persistSession:false }});
            const { data, error } = await supa.from('academias').select('id').eq('active', true);
            if (error) { console.error(error); process.exit(1); }
            console.log(JSON.stringify(data.map(a => a.id)));
          " > academias.json
          for ACADEMIA in $(cat academias.json | node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).join('\n'))"); do
            CRAWL_ID=$(node --input-type=module -e "
              import { createClient } from '@supabase/supabase-js';
              const supa = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, { auth:{ persistSession:false }});
              const { data, error } = await supa.from('crawls').insert({ academia_id: '$ACADEMIA', status:'pending', trigger:'cron', triggered_by:'gh-actions-cron' }).select('id').single();
              if (error) { console.error(error); process.exit(1); }
              console.log(data.id);
            ")
            echo "Crawling academia=$ACADEMIA crawl=$CRAWL_ID"
            ACADEMIA_ID="$ACADEMIA" CRAWL_ID="$CRAWL_ID" node dist/index.js || echo "academia $ACADEMIA falló, sigo"
          done

      # Si es dispatch (api o manual): un solo crawl
      - name: Crawl único (dispatch)
        if: github.event_name != 'schedule'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          ACADEMIA_ID: ${{ steps.inputs.outputs.academia_id }}
          CRAWL_ID: ${{ steps.inputs.outputs.crawl_id }}
        working-directory: crawler
        run: |
          if [ -z "$CRAWL_ID" ] && [ -n "$ACADEMIA_ID" ]; then
            # workflow_dispatch sin crawl_id: lo creamos
            CRAWL_ID=$(node --input-type=module -e "
              import { createClient } from '@supabase/supabase-js';
              const supa = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, { auth:{ persistSession:false }});
              const { data, error } = await supa.from('crawls').insert({ academia_id: '$ACADEMIA_ID', status:'pending', trigger:'manual', triggered_by:'gh-actions-manual' }).select('id').single();
              if (error) { console.error(error); process.exit(1); }
              console.log(data.id);
            ")
            export CRAWL_ID
          fi
          if [ -z "$ACADEMIA_ID" ] || [ -z "$CRAWL_ID" ]; then
            echo "Falta academia_id o crawl_id"
            exit 1
          fi
          node dist/index.js
